spring:
  application:
    name: bikepadrao

  # Importa as configuracoes locais do arquivo .env
  config:
    import: optional:file:./.env[.properties]

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: "classpath:db/migration"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

loja:
  whatsapp:
    numero: "${WHATSAPP_NUMBER}"

  base-url: "${SHOP_BASE_URL}"

storage:
  produtos-dir: "${PRODUCT_IMAGES_DIR}"

admin:
  username: "${ADMIN_USERNAME}"
  password: "${ADMIN_PASSWORD}"
