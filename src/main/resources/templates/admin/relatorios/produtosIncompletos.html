<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo + ' | Bike Padrão'}">
        Relatório | Bike Padrão
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/theme.css}">

</head>

<body class="bp-admin-page">


<div th:replace="~{admin/fragments/header :: adminHeader}"></div>


<main class="bp-admin-main">

    <div class="container">


        <!-- CABEÇALHO -->

        <div class="bp-admin-list-heading">

            <div>
                <span class="bp-section-eyebrow">
                    QUALIDADE DO CATÁLOGO
                </span>
                <h1 th:text="${titulo}">
                    Produtos incompletos
                </h1>
                <p th:text="${descricao}">
                    Produtos com informações pendentes.
                </p>
            </div>

            <div class="bp-report-export-actions">
                <a th:href="@{/admin/relatorios/{tipo}/exportar/csv(tipo=${tipoExportacao})}"
                   class="bp-admin-primary-button">
                    Exportar CSV
                    <span>↓</span>
                </a>
                <a th:href="@{/admin/relatorios/{tipo}/exportar/pdf(tipo=${tipoExportacao})}"
                   class="bp-admin-primary-button">
                    Exportar PDF
                    <span>↓</span>
                </a>
            </div>

        </div>


        <!-- RESUMO -->

        <div class="bp-incomplete-report-summary">

            <span>
                Produtos encontrados
            </span>

            <strong th:text="${#lists.size(produtos)}">
                0
            </strong>

        </div>


        <!-- TABELA -->

        <div class="bp-admin-table-card">

            <div class="bp-admin-table-wrapper">

                <table class="bp-admin-table">

                    <thead>

                    <tr>

                        <th>Produto</th>

                        <th>SKU</th>

                        <th>Categoria</th>

                        <th>Marca</th>

                        <th>Status</th>

                        <th>Ação</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="produto : ${produtos}">

                        <td>
                            <strong th:text="${produto.nome}">
                                Produto
                            </strong>
                        </td>


                        <td th:text="${produto.sku}">
                            SKU
                        </td>


                        <td th:text="${produto.categoria}">
                            Categoria
                        </td>


                        <td th:text="${produto.marca != null
                            ? produto.marca
                            : '—'}">
                            Marca
                        </td>


                        <td>

                            <span class="bp-stock-status bp-stock-status-ok"
                                  th:if="${produto.ativo}">
                                Ativo
                            </span>

                            <span class="bp-stock-status bp-stock-status-danger"
                                  th:unless="${produto.ativo}">
                                Inativo
                            </span>

                        </td>


                        <td>

                            <a class="bp-admin-edit-button"
                               th:href="@{/admin/produtos/{id}/editar(id=${produto.id})}">
                                Editar
                            </a>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(produtos)}">

                        <td colspan="6"
                            class="bp-stock-report-empty">

                            Nenhum produto encontrado.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <div class="bp-admin-store-link-area">

            <a th:href="@{/admin/relatorios}"
               class="bp-admin-store-link">

                ← Voltar aos relatórios

            </a>

        </div>


    </div>

</main>


</body>
</html>
