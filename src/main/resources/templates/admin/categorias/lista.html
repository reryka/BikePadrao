<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Categorias | Bike Padrão
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/theme.css}">

</head>

<body class="bp-admin-page">


<!-- =====================================================
     HEADER
     ===================================================== -->

<div th:replace="~{admin/fragments/header :: adminHeader}"></div>


<!-- =====================================================
     CONTEÚDO
     ===================================================== -->

<main class="bp-admin-main">

    <div class="container">


        <!-- =================================================
             CABEÇALHO
             ================================================= -->

        <div class="bp-admin-list-heading">

            <div>

                <span class="bp-section-eyebrow">
                    ORGANIZAÇÃO DO CATÁLOGO
                </span>

                <h1>
                    Categorias
                </h1>

                <p>
                    Cadastre e organize as categorias
                    utilizadas nos produtos da loja.
                </p>

            </div>


            <a class="bp-admin-primary-button"
               th:href="@{/admin/categorias/nova}">

                Nova categoria

                <span>
                    +
                </span>

            </a>

        </div>


        <!-- =================================================
             MENSAGEM
             ================================================= -->

        <div class="bp-admin-message bp-admin-message-success"
             th:if="${sucesso}"
             th:text="${sucesso}">

            Operação realizada com sucesso.

        </div>


        <!-- =================================================
             TABELA
             ================================================= -->

        <div class="bp-admin-table-card">

            <div class="bp-admin-table-wrapper">

                <table class="bp-admin-table">

                    <thead>

                    <tr>

                        <th>
                            Nome
                        </th>

                        <th>
                            Slug
                        </th>

                        <th>
                            Status
                        </th>

                        <th class="bp-admin-actions-heading">
                            Ações
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <tr th:each="categoria : ${categorias}">


                        <!-- NOME -->

                        <td>

                            <strong class="bp-admin-entity-name"
                                    th:text="${categoria.nome}">

                                Categoria

                            </strong>

                        </td>


                        <!-- SLUG -->

                        <td>

                            <span class="bp-admin-sku"
                                  th:text="${categoria.slug}">

                                slug

                            </span>

                        </td>


                        <!-- STATUS -->

                        <td>


                            <span class="bp-admin-status bp-admin-status-active"
                                  th:if="${categoria.ativo}">

                                <span></span>

                                Ativa

                            </span>


                            <span class="bp-admin-status bp-admin-status-inactive"
                                  th:unless="${categoria.ativo}">

                                <span></span>

                                Inativa

                            </span>


                        </td>


                        <!-- AÇÕES -->

                        <td>

                            <div class="bp-admin-actions">


                                <a class="bp-admin-edit-button"
                                   th:href="@{/admin/categorias/{id}/editar(id=${categoria.id})}">

                                    Editar

                                </a>


                                <form
                                        th:action="@{/admin/categorias/{id}/status(id=${categoria.id})}"
                                        method="post">


                                    <input
                                            type="hidden"
                                            th:name="${_csrf.parameterName}"
                                            th:value="${_csrf.token}">


                                    <button
                                            type="submit"
                                            class="bp-admin-status-button">

                                        <span th:if="${categoria.ativo}">
                                            Desativar
                                        </span>

                                        <span th:unless="${categoria.ativo}">
                                            Ativar
                                        </span>

                                    </button>


                                </form>


                            </div>

                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>

        </div>


        <!-- VOLTAR -->

        <div class="bp-admin-store-link-area">

            <a th:href="@{/admin}"
               class="bp-admin-store-link">

                ← Voltar ao painel

            </a>

        </div>


    </div>

</main>


</body>
</html>
