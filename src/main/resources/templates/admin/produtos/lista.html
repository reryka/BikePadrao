<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Produtos | Bike Padrão
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/theme.css}">

</head>

<body class="bp-admin-page">


<!-- =====================================================
     HEADER
     ===================================================== -->

<div th:replace="~{admin/fragments/header :: adminHeader}"></div>


<!-- =====================================================
     CONTEÚDO
     ===================================================== -->

<main class="bp-admin-main">

    <div class="container">


        <!-- =================================================
             CABEÇALHO DA PÁGINA
             ================================================= -->

        <div class="bp-admin-list-heading">


            <div>

                <span class="bp-section-eyebrow">
                    CATÁLOGO
                </span>

                <h1>
                    Produtos
                </h1>

                <p>
                    Cadastre e gerencie os produtos
                    disponíveis na loja.
                </p>

            </div>


            <a class="bp-admin-primary-button"
               th:href="@{/admin/produtos/novo}">

                Novo produto

                <span>
                    +
                </span>

            </a>


        </div>


        <!-- =================================================
      FILTROS
      ================================================= -->

        <form class="bp-admin-product-filters"
              method="get"
              th:action="@{/admin/produtos}">


            <!-- BUSCA -->

            <div class="bp-admin-product-filter bp-admin-product-filter-search">

                <label for="busca">
                    Buscar produto
                </label>

                <input
                        id="busca"
                        name="busca"
                        type="text"
                        th:value="${busca}"
                        placeholder="Nome ou SKU..."
                        autocomplete="off">

            </div>


            <!-- CATEGORIA -->

            <div class="bp-admin-product-filter">

                <label for="categoriaId">
                    Categoria
                </label>

                <select id="categoriaId"
                        name="categoriaId">

                    <option value="">
                        Todas
                    </option>

                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.id}"
                            th:text="${categoria.nome}"
                            th:selected="${categoriaSelecionada != null and categoria.id == categoriaSelecionada}">
                        Categoria
                    </option>

                </select>

            </div>


            <!-- MARCA -->

            <div class="bp-admin-product-filter">

                <label for="marcaId">
                    Marca
                </label>

                <select id="marcaId"
                        name="marcaId">

                    <option value="">
                        Todas
                    </option>

                    <option th:each="marca : ${marcas}"
                            th:value="${marca.id}"
                            th:text="${marca.nome}"
                            th:selected="${marcaSelecionada != null and marca.id == marcaSelecionada}">
                        Marca
                    </option>

                </select>

            </div>


            <!-- STATUS -->

            <div class="bp-admin-product-filter">

                <label for="ativo">
                    Status
                </label>

                <select id="ativo"
                        name="ativo">

                    <option value="">
                        Todos
                    </option>

                    <option value="true"
                            th:selected="${ativoSelecionado != null and ativoSelecionado}">
                        Ativos
                    </option>

                    <option value="false"
                            th:selected="${ativoSelecionado != null and !ativoSelecionado}">
                        Inativos
                    </option>

                </select>

            </div>


            <!-- DESTAQUE -->

            <div class="bp-admin-product-filter">

                <label for="destaque">
                    Destaque
                </label>

                <select id="destaque"
                        name="destaque">

                    <option value="">
                        Todos
                    </option>

                    <option value="true"
                            th:selected="${destaqueSelecionado != null and destaqueSelecionado}">
                        Sim
                    </option>

                    <option value="false"
                            th:selected="${destaqueSelecionado != null and !destaqueSelecionado}">
                        Não
                    </option>

                </select>

            </div>


            <!-- AÇÕES -->

            <div class="bp-admin-product-filter-actions">

                <button type="submit"
                        class="bp-admin-product-search-button">

                    Buscar

                </button>


                <a th:href="@{/admin/produtos}"
                   class="bp-admin-product-search-clear">

                    Limpar

                </a>

            </div>

        </form>

        <!-- =================================================
             MENSAGEM
             ================================================= -->

        <div class="bp-admin-message bp-admin-message-success"
             th:if="${sucesso}"
             th:text="${sucesso}">

            Operação realizada com sucesso.

        </div>


        <!-- =================================================
     AÇÕES EM LOTE
     ================================================= -->

        <div class="bp-admin-bulk-actions"
             id="acoesEmLote"
             hidden>

            <div class="bp-admin-bulk-selection">

                <strong id="quantidadeSelecionada">
                    0
                </strong>

                <span id="textoSelecionados">
            produtos selecionados
        </span>

            </div>


            <div class="bp-admin-bulk-controls">

                <select id="acaoEmLote"
                        class="bp-admin-bulk-select">

                    <option value="">
                        Ação em lote
                    </option>

                    <option value="ATIVAR">
                        Ativar
                    </option>

                    <option value="DESATIVAR">
                        Desativar
                    </option>

                    <option value="DESTACAR">
                        Adicionar aos destaques
                    </option>

                    <option value="REMOVER_DESTAQUE">
                        Remover dos destaques
                    </option>

                    <option value="EXCLUIR">
                        Excluir
                    </option>

                </select>


                <button type="button"
                        id="aplicarAcaoEmLote"
                        class="bp-admin-bulk-apply"
                        disabled>

                    Aplicar

                </button>

            </div>

        </div>
        <!-- =================================================
             TABELA
             ================================================= -->

        <div class="bp-admin-table-card">

            <div class="bp-admin-table-wrapper">

                <table class="bp-admin-table">

                    <thead>

                    <tr>

                        <th class="bp-admin-selection-heading">

                            <input
                                    type="checkbox"
                                    id="selecionarTodos"
                                    class="bp-admin-product-checkbox"
                                    aria-label="Selecionar todos os produtos">

                        </th>

                        <th>
                            Produto
                        </th>

                        <th>
                            SKU
                        </th>

                        <th>
                            Preço
                        </th>

                        <th>
                            Estoque
                        </th>

                        <th>
                            Status
                        </th>

                        <th class="bp-admin-actions-heading">
                            Ações
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="produto : ${produtos}">

                        <!-- SELEÇÃO -->

                        <td class="bp-admin-selection-cell">

                            <input
                                    type="checkbox"
                                    class="bp-admin-product-checkbox bp-admin-product-item-checkbox"
                                    name="produtoIds"
                                    th:value="${produto.id}"
                                    form="formAcaoEmLote"
                                    th:attr="aria-label=${'Selecionar ' + produto.nome}">

                        </td>
                        <!-- PRODUTO -->

                        <td>

                            <strong class="bp-admin-product-name"
                                    th:text="${produto.nome}">

                                Produto

                            </strong>

                        </td>


                        <!-- SKU -->

                        <td>

                            <span class="bp-admin-sku"
                                  th:text="${produto.sku}">

                                SKU

                            </span>

                        </td>


                        <!-- PREÇO -->

                        <td>

                            <strong class="bp-admin-price"
                                    th:text="${'R$ ' + produto.preco}">

                                R$ 0,00

                            </strong>

                        </td>


                        <!-- ESTOQUE -->

                        <td>

                            <span class="bp-admin-stock"
                                  th:text="${produto.estoque}">

                                0

                            </span>

                        </td>


                        <!-- STATUS -->

                        <td>


                            <span class="bp-admin-status bp-admin-status-active"
                                  th:if="${produto.ativo}">

                                <span></span>

                                Ativo

                            </span>


                            <span class="bp-admin-status bp-admin-status-inactive"
                                  th:unless="${produto.ativo}">

                                <span></span>

                                Inativo

                            </span>


                        </td>


                        <!-- AÇÕES -->

                        <td>


                            <div class="bp-admin-actions">


                                <a class="bp-admin-edit-button"
                                   th:href="@{/admin/produtos/{id}/editar(id=${produto.id})}">

                                    Editar

                                </a>


                                <form
                                        th:action="@{/admin/produtos/{id}/status(id=${produto.id})}"
                                        method="post">

                                    <button
                                            type="submit"
                                            class="bp-admin-status-button">


                                        <span th:if="${produto.ativo}">
                                            Desativar
                                        </span>


                                        <span th:unless="${produto.ativo}">
                                            Ativar
                                        </span>


                                    </button>


                                </form>


                            </div>


                        </td>


                    </tr>

                    <!-- =================================================
                     FORMULÁRIO OCULTO - AÇÕES EM LOTE
                     ================================================= -->

                    <form id="formAcaoEmLote"
                          method="post"
                          th:action="@{/admin/produtos/lote}"
                          hidden>

                        <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}">

                        <input
                                type="hidden"
                                name="acao"
                                id="acaoEmLoteHidden">

                    </form>

                    <script>
                        document.addEventListener("DOMContentLoaded", function () {

                            const selecionarTodos =
                                document.getElementById("selecionarTodos");

                            const produtos =
                                document.querySelectorAll(
                                    ".bp-admin-product-item-checkbox"
                                );

                            const acoesEmLote =
                                document.getElementById("acoesEmLote");

                            const quantidadeSelecionada =
                                document.getElementById("quantidadeSelecionada");

                            const textoSelecionados =
                                document.getElementById("textoSelecionados");

                            const acaoEmLote =
                                document.getElementById("acaoEmLote");

                            const aplicarAcaoEmLote =
                                document.getElementById("aplicarAcaoEmLote");


                            /* FORMULÁRIO OCULTO */

                            const formAcaoEmLote =
                                document.getElementById("formAcaoEmLote");

                            const acaoEmLoteHidden =
                                document.getElementById("acaoEmLoteHidden");


                            /* =====================================================
                               ATUALIZA INTERFACE
                               ===================================================== */

                            function atualizarSelecao() {

                                const selecionados =
                                    document.querySelectorAll(
                                        ".bp-admin-product-item-checkbox:checked"
                                    );

                                const quantidade =
                                    selecionados.length;


                                quantidadeSelecionada.textContent =
                                    quantidade;


                                textoSelecionados.textContent =
                                    quantidade === 1
                                        ? "produto selecionado"
                                        : "produtos selecionados";


                                acoesEmLote.hidden =
                                    quantidade === 0;


                                selecionarTodos.checked =
                                    produtos.length > 0 &&
                                    quantidade === produtos.length;


                                selecionarTodos.indeterminate =
                                    quantidade > 0 &&
                                    quantidade < produtos.length;


                                atualizarBotaoAplicar();
                            }


                            function atualizarBotaoAplicar() {

                                const existeSelecionado =
                                    document.querySelector(
                                        ".bp-admin-product-item-checkbox:checked"
                                    ) !== null;

                                const existeAcao =
                                    acaoEmLote.value !== "";


                                aplicarAcaoEmLote.disabled =
                                    !existeSelecionado ||
                                    !existeAcao;
                            }


                            /* =====================================================
                               SELECIONAR TODOS
                               ===================================================== */

                            selecionarTodos.addEventListener(
                                "change",
                                function () {

                                    produtos.forEach(function (checkbox) {

                                        checkbox.checked =
                                            selecionarTodos.checked;

                                    });


                                    atualizarSelecao();
                                }
                            );


                            /* =====================================================
                               SELEÇÃO INDIVIDUAL
                               ===================================================== */

                            produtos.forEach(function (checkbox) {

                                checkbox.addEventListener(
                                    "change",
                                    atualizarSelecao
                                );

                            });


                            /* =====================================================
                               ALTERAÇÃO DA AÇÃO
                               ===================================================== */

                            acaoEmLote.addEventListener(
                                "change",
                                atualizarBotaoAplicar
                            );


                            /* =====================================================
                               EXECUTAR AÇÃO EM LOTE
                               ===================================================== */

                            aplicarAcaoEmLote.addEventListener(
                                "click",
                                function () {

                                    const acao =
                                        acaoEmLote.value;


                                    /*
                                     * Por enquanto somente estas duas ações
                                     * estão implementadas no backend.
                                     */

                                    if (
                                        acao !== "ATIVAR" &&
                                        acao !== "DESATIVAR" &&
                                        acao !== "DESTACAR" &&
                                        acao !== "REMOVER_DESTAQUE" &&
                                        acao !== "EXCLUIR"
                                    ) {

                                        alert(
                                            "Esta ação ainda não foi implementada."
                                        );

                                        return;
                                    }


                                    const selecionados =
                                        document.querySelectorAll(
                                            ".bp-admin-product-item-checkbox:checked"
                                        );


                                    if (selecionados.length === 0) {

                                        alert(
                                            "Selecione pelo menos um produto."
                                        );

                                        return;
                                    }

                                    const quantidade =
                                        selecionados.length;


                                    let mensagemConfirmacao = "";


                                    switch (acao) {

                                        case "ATIVAR":

                                            mensagemConfirmacao =
                                                "Deseja ativar "
                                                + quantidade
                                                + " produto(s) selecionado(s)?";

                                            break;


                                        case "DESATIVAR":

                                            mensagemConfirmacao =
                                                "Deseja desativar "
                                                + quantidade
                                                + " produto(s) selecionado(s)?";

                                            break;


                                        case "DESTACAR":

                                            mensagemConfirmacao =
                                                "Deseja adicionar "
                                                + quantidade
                                                + " produto(s) aos destaques?";

                                            break;


                                        case "REMOVER_DESTAQUE":

                                            mensagemConfirmacao =
                                                "Deseja remover "
                                                + quantidade
                                                + " produto(s) dos destaques?";

                                            break;

                                        case "EXCLUIR":

                                            mensagemConfirmacao =
                                                "ATENÇÃO!\n\n"
                                                + "Você está prestes a excluir permanentemente "
                                                + quantidade
                                                + " produto(s).\n\n"
                                                + "As imagens e especificações relacionadas também serão excluídas.\n\n"
                                                + "Esta ação não poderá ser desfeita.\n\n"
                                                + "Deseja continuar?";

                                            break;
                                    }


                                    if (
                                        !confirm(mensagemConfirmacao)
                                    ) {

                                        return;
                                    }

                                    /* DEFINE A AÇÃO */

                                    acaoEmLoteHidden.value =
                                        acao;


                                    /* ENVIA PARA O BACKEND */

                                    formAcaoEmLote.submit();

                                }
                            );


                            /* ESTADO INICIAL */

                            atualizarSelecao();

                        });
                    </script>
                    </tbody>


                </table>


            </div>


        </div>


        <!-- VOLTAR -->

        <div class="bp-admin-store-link-area">

            <a th:href="@{/admin}"
               class="bp-admin-store-link">

                ← Voltar ao painel

            </a>

        </div>


    </div>

</main>


</body>

</html>
